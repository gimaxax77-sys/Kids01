<!-- 유아 자유탐색형 분류 놀이(sort) 프로토타입 - 색·모양으로 나눠 담기 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>분류 놀이</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#fbf6ea; font-family:sans-serif; }
  #stage { position:fixed; inset:0; }

  .bin {
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:22px; transition:transform .15s ease;
  }
  .bin .target { width:70%; height:70%; opacity:.35; }
  .bin.glow { animation:glow .5s ease; }
  @keyframes glow { 50% { transform:scale(1.15); } }
  /* 담긴 것 토큰: 칸 아래쪽에 쌓여 진행이 보이게 */
  .token { position:absolute; bottom:6%; animation:pop .35s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { 0%{ transform:scale(0); } 100%{ transform:scale(1); } }

  .item {
    position:absolute; touch-action:none; cursor:grab;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));
    transition:left .28s cubic-bezier(.4,1.3,.5,1), top .28s cubic-bezier(.4,1.3,.5,1), transform .28s ease, opacity .28s ease;
  }
  .item.dragging { transition:none; cursor:grabbing; filter:drop-shadow(0 10px 12px rgba(0,0,0,.3)); z-index:50; }
  .item.gone { transform:scale(.2); opacity:0; }
  /* 아이템이 살짝 흔들려 "만져봐" 신호 (드래그·사라짐 중엔 정지) */
  .item svg { display:block; animation:wiggle 2.6s ease-in-out infinite; }
  .item.dragging svg, .item.gone svg { animation:none; }
  @keyframes wiggle { 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-4%) rotate(2deg); } }

  /* 하단 난이도 점 버튼 (칸 수 2/3/4) */
  #diff { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:3.5vw; }
  #diff button {
    border:none; background:#e6dcc4; border-radius:50%; cursor:pointer;
    width:1.4cm; height:1.4cm; max-width:11vw; max-height:6.5vh;
    display:flex; align-items:center; justify-content:center; gap:3px; padding:0;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
  }
  #diff button.on { background:#cdbd97; transform:scale(1.12); }
  #diff button i { width:6px; height:6px; border-radius:50%; background:#6b5b39; display:block; }

  /* 좌상단 홈(놀이방으로) */
  #home {
    position:fixed; top:calc(2.2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:20;
    width:1.7cm; height:1.7cm; max-width:12vw; max-height:7vh;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:5.5vw;
    box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite;
  }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }

  /* 색/모양 모드 토글 (우상단) */
  #mode {
    position:fixed; top:calc(2.2vh + env(safe-area-inset-top)); right:calc(3vw + env(safe-area-inset-right)); border:none; border-radius:50%; cursor:pointer;
    width:1.9cm; height:1.9cm; max-width:13vw; max-height:8vh; background:#fff;
    font-size:5.5vw; line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.18);
  }
  #mode:active { transform:scale(.9); }
</style>
</head>
<body>
<div id="stage"></div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<button id="mode" aria-label="모드">🎨</button>
<div id="diff">
  <button data-n="2" aria-label="쉬움"><i></i><i></i></button>
  <button data-n="3" aria-label="보통"><i></i><i></i><i></i></button>
  <button data-n="4" aria-label="어려움"><i></i><i></i><i></i><i></i></button>
</div>

<script>
const COLORS = [
  { key:'red',    hex:'#e23b3b' },
  { key:'yellow', hex:'#f5c518' },
  { key:'blue',   hex:'#3b7de2' },
  { key:'green',  hex:'#3fae54' },
];
const SHAPES = ['circle','square','triangle','star'];
const NEUTRAL = '#8a7bd8'; // 모양 모드일 때 색은 고정(속성 하나만 다르게)

const stage = document.getElementById('stage');
let mode = 'color';   // 'color' | 'shape'
let catN = 3;         // 칸 수
let bins = [];        // {key, el, cx, cy}
let dragging = null;

// --- 도형 SVG 생성 (색·모양 지정) ---
function shapeSVG(shape, hex, size) {
  const s = size;
  const shapes = {
    circle: `<circle cx="50" cy="50" r="46" fill="${hex}"/>`,
    square: `<rect x="6" y="6" width="88" height="88" rx="14" fill="${hex}"/>`,
    triangle: `<polygon points="50,6 96,92 4,92" fill="${hex}"/>`,
    star: `<polygon points="50,4 61,38 97,38 68,60 79,95 50,72 21,95 32,60 3,38 39,38" fill="${hex}"/>`,
  };
  return `<svg width="${s}" height="${s}" viewBox="0 0 100 100">${shapes[shape]}</svg>`;
}

// 창(innerWidth)이 아니라 stage 요소 크기를 기준으로 — 스냅샷 미리보기에서 0 되는 문제 회피
function W() { return stage.clientWidth; }
function H() { return stage.clientHeight; }
function itemSize() { return Math.min(W(), H()) * 0.15; }
function binSize()  { return Math.min(W(), H()) * 0.19; }

// --- 판 새로 깔기 ---
function deal() {
  const w = W(), h = H();
  if (!w || !h) { requestAnimationFrame(deal); return; } // 레이아웃 전이면 재시도
  stage.innerHTML = '';
  bins = [];
  const bs = binSize();
  const cats = (mode === 'color' ? COLORS.slice(0, catN).map(c => c.key)
                                  : SHAPES.slice(0, catN));
  // 상단 칸(bin) 배치
  cats.forEach((key, i) => {
    const el = document.createElement('div');
    el.className = 'bin';
    const gapUnit = w / (catN + 1);
    const cx = gapUnit * (i + 1);
    const cy = h * 0.16;
    el.style.width = el.style.height = bs + 'px';
    el.style.left = (cx - bs/2) + 'px';
    el.style.top  = (cy - bs/2) + 'px';
    // 칸 안내: 색 모드=색 테두리, 모양 모드=회색 윤곽 도형
    if (mode === 'color') {
      const hex = COLORS.find(c => c.key === key).hex;
      el.style.background = hex + '22';
      el.style.border = `4px dashed ${hex}`;
      el.innerHTML = `<div class="target">${shapeSVG('circle', hex, bs*0.7)}</div>`;
    } else {
      el.style.background = '#00000008';
      el.style.border = '4px dashed #b3a789';
      el.innerHTML = `<div class="target">${shapeSVG(key, '#b3a789', bs*0.7)}</div>`;
    }
    stage.appendChild(el);
    bins.push({ key, el, cx, cy });
  });

  // 하단 아이템 배치 (칸마다 2개씩, 섞어서)
  const items = [];
  cats.forEach(key => { items.push(key); items.push(key); });
  shuffle(items);
  const is = itemSize();
  const per = items.length;
  const cols = Math.ceil(per / 2); // 2줄 격자로 배치 → 좁은 폰에서 가로 겹침 방지
  items.forEach((key, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    const col = i % cols, row = Math.floor(i / cols);
    const x = (w / (cols + 1)) * (col + 1);
    const y = h * (0.6 + row * 0.18);
    el.style.width = el.style.height = is + 'px';
    el.style.left = (x - is/2) + 'px';
    el.style.top  = (y - is/2) + 'px';
    el.dataset.key = key;
    el.dataset.homeX = el.style.left;
    el.dataset.homeY = el.style.top;
    if (mode === 'color') {
      el.innerHTML = shapeSVG('circle', COLORS.find(c => c.key === key).hex, is);
    } else {
      el.innerHTML = shapeSVG(key, NEUTRAL, is);
    }
    attachDrag(el);
    stage.appendChild(el);
  });
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

// --- 드래그 ---
function attachDrag(el) {
  let offX=0, offY=0;
  el.addEventListener('pointerdown', (e) => {
    dragging = el; el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    audio();
  });
  el.addEventListener('pointermove', (e) => {
    if (dragging !== el) return;
    el.style.left = (e.clientX - offX) + 'px';
    el.style.top  = (e.clientY - offY) + 'px';
  });
  el.addEventListener('pointerup', (e) => {
    if (dragging !== el) return;
    dragging = null; el.classList.remove('dragging');
    const cx = e.clientX, cy = e.clientY;
    const hit = bins.find(b => {
      const r = b.el.getBoundingClientRect();
      return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
    });
    if (hit && hit.key === el.dataset.key) {
      // 정답: 칸 중심으로 빨려 들어가듯 + 사라짐
      const bs = binSize();
      el.style.left = (hit.cx - bs*0.28) + 'px';
      el.style.top  = (hit.cy - bs*0.28) + 'px';
      el.classList.add('gone');
      hit.el.classList.remove('glow'); void hit.el.offsetWidth; hit.el.classList.add('glow');
      addToken(hit, el.dataset.key);
      happy();
      setTimeout(() => { el.remove(); if (!stage.querySelector('.item')) win(); }, 300);
    } else {
      // 오답 또는 허공: 벌 없이 제자리로
      el.style.left = el.dataset.homeX; el.style.top = el.dataset.homeY;
      blip();
    }
  });
}

// 담긴 아이템을 칸 아래에 작은 토큰으로 쌓기
function addToken(bin, key) {
  const n = bin.el.querySelectorAll('.token').length;
  const size = binSize() * 0.26;
  const tok = document.createElement('div');
  tok.className = 'token';
  tok.style.width = tok.style.height = size + 'px';
  tok.style.left = (12 + n * 38) + '%';
  tok.innerHTML = (mode === 'color')
    ? shapeSVG('circle', COLORS.find(c => c.key === key).hex, size)
    : shapeSVG(key, NEUTRAL, size);
  bin.el.appendChild(tok);
}

// 전부 담으면: 잔잔한 축하 후 새 판
function win() {
  bins.forEach((b,i) => setTimeout(() => { b.el.classList.remove('glow'); void b.el.offsetWidth; b.el.classList.add('glow'); }, i*120));
  chord();
  setTimeout(deal, 1100);
}

// --- 컨트롤 ---
document.getElementById('mode').addEventListener('click', (e) => {
  mode = (mode === 'color') ? 'shape' : 'color';
  e.currentTarget.textContent = (mode === 'color') ? '🎨' : '🔷';
  deal(); ping();
});
document.querySelectorAll('#diff button').forEach(btn => {
  if (+btn.dataset.n === catN) btn.classList.add('on');
  btn.addEventListener('click', () => {
    catN = +btn.dataset.n;
    document.querySelectorAll('#diff button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    deal(); ping();
  });
});
window.addEventListener('resize', () => deal());

// --- 소리 (WebAudio) ---
// ponytail: 오실레이터로 처리. 샘플 사운드 필요해지면 그때 교체.
let ac;
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function beep(freq, dur, type='sine', vol=0.12){
  const a=audio(), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=0.001;
  o.connect(g).connect(a.destination); o.start();
  g.gain.linearRampToValueAtTime(vol, a.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.stop(a.currentTime+dur+0.02);
}
function happy(){ beep(523,0.15); setTimeout(()=>beep(784,0.22),90); }        // 도→솔
function chord(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.35,'triangle'),i*110)); }
function blip(){ beep(196,0.16,'sine',0.08); }                                 // 낮고 부드러운 "다시"
function ping(){ beep(600,0.14,'triangle'); }

requestAnimationFrame(deal);
window.addEventListener('load', deal);
</script>
</body>
</html>

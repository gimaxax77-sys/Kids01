<!-- 유아 학습형 패턴 잇기 - 규칙을 보고 다음에 올 것 고르기(5세+) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>패턴 잇기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#f4f0e6; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6vh;
    padding:calc(9vh + env(safe-area-inset-top)) 4vw calc(4vh + env(safe-area-inset-bottom)); }
  #seq { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:2.5vw; }
  .tile { width:min(2.2cm,15vw); aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:min(9vw,58px); line-height:1;
    background:#fffdf7; border-radius:14px; box-shadow:0 2px 5px rgba(0,0,0,.12); }
  .tile.q { background:#efe6cf; color:#b3a789; font-weight:900; }
  .tile.filled { background:#d9f2e0; animation:pop .4s ease; }
  @keyframes pop { 50%{ transform:scale(1.2);} }
  #choices { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3vw; }
  .choice { width:min(2.4cm,17vw); aspect-ratio:1; border:none; border-radius:16px; cursor:pointer; font-size:min(10vw,65px); line-height:1;
    background:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .choice:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15); }
  .choice.shake { animation:shake .35s; }
  @keyframes shake { 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  #home { position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:10;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:min(5.5vw,36px); box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #bottom { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:3vw; }
  #diff { display:flex; gap:2vw; }
  #diff button { border:none; background:#e6dcc4; color:#6b5b39; font-weight:bold; border-radius:12px; cursor:pointer;
    width:1.2cm; height:1.2cm; max-width:9vw; max-height:5.5vh; font-size:min(4.6vw,30px); box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #diff button.on { background:#cdbd97; color:#fff; transform:scale(1.1); }
  #new { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.4cm; height:1.4cm; max-width:11vw; max-height:6vh; font-size:min(5vw,32px); box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #new:active { transform:scale(.9); }
</style>
</head>
<body>
<div id="stage"><div id="seq"></div><div id="choices"></div></div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<div id="bottom">
  <div id="diff">
    <button data-n="2" aria-label="쉬움">2</button>
    <button data-n="3" aria-label="보통">3</button>
    <button data-n="4" aria-label="어려움">4</button>
  </div>
  <button id="new" aria-label="새 문제">🔄</button>
</div>
<script src="패턴잇기.js"></script>
</body>
</html>

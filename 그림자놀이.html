<!-- 유아 자유탐색형 그림자 맞추기 - 밝은 그림을 같은 그림자 위로 끌어놓기 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>그림자 맞추기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#eef0f6; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column;
    padding:calc(9vh + env(safe-area-inset-top)) 3vw calc(3vh + env(safe-area-inset-bottom)); }
  #shadows { flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4vw; min-height:34vh; align-content:center; }
  #tray { flex:1; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4vw; align-content:center; }
  .shadow { width:min(2.6cm, 20vw); aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12vw; line-height:1;
    filter:brightness(0) opacity(.32); border-radius:16px; }
  .shadow.filled { filter:none; }
  .shadow.pop { animation:pop .5s ease; }
  @keyframes pop { 50%{ transform:scale(1.15);} }
  .obj { font-size:12vw; line-height:1; cursor:grab; touch-action:none; filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
  .obj.lift { position:fixed; z-index:100; cursor:grabbing; }
  .obj.placed { filter:none; cursor:default; }

  #home { position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:20;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:5.5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #bottom { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:20; display:flex; align-items:center; gap:3vw; }
  #diff { display:flex; gap:2vw; }
  #diff button { border:none; background:#dfe2ee; color:#4a4f66; font-weight:bold; border-radius:12px; cursor:pointer;
    width:1.2cm; height:1.2cm; max-width:9vw; max-height:5.5vh; font-size:4.6vw; box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #diff button.on { background:#7a80a8; color:#fff; transform:scale(1.1); }
  #new { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.4cm; height:1.4cm; max-width:11vw; max-height:6vh; font-size:5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #new:active { transform:scale(.9); }
</style>
</head>
<body>
<div id="stage"><div id="shadows"></div><div id="tray"></div></div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<div id="bottom">
  <div id="diff">
    <button data-n="3" aria-label="쉬움">3</button>
    <button data-n="4" aria-label="보통">4</button>
    <button data-n="5" aria-label="어려움">5</button>
  </div>
  <button id="new" aria-label="새 판">🔄</button>
</div>
<script src="그림자놀이.js"></script>
</body>
</html>

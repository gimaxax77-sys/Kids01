<!-- 유아 자유탐색형 숫자 세기 - 물건을 하나씩 탭해 세기 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>숫자 세기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#eaf7ef; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }
  #bignum { position:fixed; top:calc(1vh + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:10;
    color:#3fae54; font-weight:900; font-size:min(11vw,72px); line-height:1; }
  #bignum.pop { animation:pop .25s ease; }
  #bignum.big { font-size:min(20vw,130px); transition:font-size .3s ease; }
  @keyframes pop { 50%{ transform:translateX(-50%) scale(1.3);} }
  #board { flex:1; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:3vw;
    padding:calc(13vh + env(safe-area-inset-top)) 5vw calc(9vh + env(safe-area-inset-bottom)); }
  .obj { border:none; background:transparent; cursor:pointer; font-size:min(15vw,98px); line-height:1;
    transition:transform .15s ease, opacity .2s ease; }
  .obj:active { transform:scale(.9); }
  .obj.done { opacity:.32; transform:scale(.82); }

  #home { position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:20;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:min(5.5vw,36px); box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #bottom { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:20; display:flex; align-items:center; gap:3vw; }
  #diff { display:flex; gap:2vw; }
  #diff button { border:none; background:#cfe9d8; color:#2f6b48; font-weight:bold; border-radius:12px; cursor:pointer;
    width:1.3cm; height:1.2cm; max-width:12vw; max-height:5.5vh; font-size:min(4.6vw,30px); box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #diff button.on { background:#3fae54; color:#fff; transform:scale(1.1); }
  #new { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.4cm; height:1.4cm; max-width:11vw; max-height:6vh; font-size:min(5vw,32px); box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #new:active { transform:scale(.9); }
</style>
</head>
<body>
<div id="stage"><div id="board"></div></div>
<div id="bignum">0</div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<div id="bottom">
  <div id="diff">
    <button data-n="5" aria-label="5까지">1~5</button>
    <button data-n="10" aria-label="10까지">1~10</button>
  </div>
  <button id="new" aria-label="새 물건">🔄</button>
</div>
<script src="숫자놀이.js"></script>
</body>
</html>

<!-- 유아 학습형 틀린 그림 찾기 - 두 그림에서 다른 곳 탭 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>틀린 그림 찾기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#f4f0e6; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    padding:calc(8vh + env(safe-area-inset-top)) 2vw calc(8vh + env(safe-area-inset-bottom)); gap:2vh; }
  #status { font-size:min(6vw,39px); font-weight:800; color:#5a4a2a; }
  #panels { flex:1; min-height:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3vw; width:100%; }
  .grid { display:grid; gap:1.2vw; background:#fff; border-radius:14px; padding:2vw; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .cell { width:min(1.9cm,15vw,10vh); aspect-ratio:1; border:none; background:transparent; cursor:pointer; font-size:min(9vw,58px,6vh); line-height:1; border-radius:10px; }
  .cell:active { transform:scale(.92); }
  .cell.found { background:#c9f0d6; box-shadow:inset 0 0 0 3px #3fae54; }
  .cell.cheer { animation:cheer .5s ease; }
  @keyframes cheer { 50%{ transform:scale(1.18);} }

  #home { position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:10;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:min(5.5vw,36px); box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #bottom { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:3vw; }
  #diff { display:flex; gap:2vw; }
  #diff button { border:none; background:#e6dcc4; color:#6b5b39; font-weight:bold; border-radius:12px; cursor:pointer;
    width:1.2cm; height:1.2cm; max-width:9vw; max-height:5.5vh; font-size:min(4.6vw,30px); box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #diff button.on { background:#cdbd97; color:#fff; transform:scale(1.1); }
  #new { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.4cm; height:1.4cm; max-width:11vw; max-height:6vh; font-size:min(5vw,32px); box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #new:active { transform:scale(.9); }
</style>
</head>
<body>
<div id="stage">
  <div id="status">🔍 0 / 3</div>
  <div id="panels"><div id="gridL" class="grid"></div><div id="gridR" class="grid"></div></div>
</div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<div id="bottom">
  <div id="diff">
    <button data-n="3" aria-label="쉬움">3</button>
    <button data-n="5" aria-label="어려움">5</button>
  </div>
  <button id="new" aria-label="새 문제">🔄</button>
</div>
<script src="level.js"></script>
<script src="틀린그림.js"></script>
<script src="bgm.js"></script>
</body>
</html>

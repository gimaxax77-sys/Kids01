<!-- 유아 자유탐색형 놀이방 홈 - 장난감을 모아 고르는 메인 화면 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>놀이방</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#f3ecdb; }
  #room {
    position:fixed; inset:0; display:flex; flex-wrap:wrap;
    align-items:center; justify-content:center; gap:6vmin; padding:6vmin;
  }
  .toy {
    display:block; width:34vmin; height:34vmin; max-width:340px; max-height:340px;
    border:none; border-radius:28px; cursor:pointer; background:#fffdf7;
    box-shadow:0 8px 20px rgba(0,0,0,.14);
    animation:bob 3.2s ease-in-out infinite;
    transition:transform .15s ease;
  }
  .toy:nth-child(2){ animation-delay:.6s; }
  .toy:nth-child(3){ animation-delay:1.2s; }
  .toy:nth-child(4){ animation-delay:1.8s; }
  .toy:nth-child(5){ animation-delay:2.4s; }
  .toy:nth-child(6){ animation-delay:3s; }
  .toy:active { transform:scale(.94); }
  .toy svg { width:100%; height:100%; }
  @keyframes bob { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1.4vmin); } }
</style>
</head>
<body>
<div id="room">
  <!-- 그림판: 색색의 낙서 -->
  <a class="toy" href="그림판.html" aria-label="그림판">
    <svg viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#fbf6ea"/>
      <path d="M20 68 Q35 30 50 60 T80 40" fill="none" stroke="#e23b3b" stroke-width="7" stroke-linecap="round"/>
      <path d="M22 80 Q40 60 60 78 T82 66" fill="none" stroke="#3b7de2" stroke-width="7" stroke-linecap="round"/>
      <path d="M26 44 Q44 26 66 34" fill="none" stroke="#f5c518" stroke-width="7" stroke-linecap="round"/>
      <circle cx="74" cy="26" r="7" fill="#3fae54"/>
    </svg>
  </a>
  <!-- 분류놀이: 도형이 칸으로 -->
  <a class="toy" href="분류놀이.html" aria-label="분류 놀이">
    <svg viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#fbf6ea"/>
      <rect x="16" y="58" width="30" height="30" rx="7" fill="none" stroke="#3b7de2" stroke-width="4" stroke-dasharray="6 5"/>
      <rect x="54" y="58" width="30" height="30" rx="7" fill="none" stroke="#e23b3b" stroke-width="4" stroke-dasharray="6 5"/>
      <circle cx="31" cy="73" r="11" fill="#3b7de2"/>
      <polygon points="69,64 80,83 58,83" fill="#e23b3b"/>
      <circle cx="34" cy="26" r="10" fill="#f5c518"/>
      <polygon points="66,16 76,34 56,34" fill="#3fae54"/>
    </svg>
  </a>
  <!-- 조각 맞추기: 퍼즐 조각 -->
  <a class="toy" href="퍼즐.html" aria-label="조각 맞추기">
    <svg viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#fbf6ea"/>
      <path d="M20 20 h26 a6 6 0 0 1 6 6 a6 6 0 0 0 12 0 a6 6 0 0 1 6 6 v26 h-56 Z" fill="#ef7d1a"/>
      <path d="M20 52 h26 a6 6 0 0 0 6 -6 a6 6 0 0 1 12 0 a6 6 0 0 0 6 6 v26 a6 6 0 0 1 -6 -6 a6 6 0 0 0 0 12 h-44 Z" fill="#3b7de2"/>
    </svg>
  </a>
  <!-- 색칠 놀이: 팔레트와 붓 -->
  <a class="toy" href="색칠놀이.html" aria-label="색칠 놀이">
    <svg viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#fbf6ea"/>
      <path d="M30 66 a26 26 0 1 1 40 -10 c-4 8 -14 4 -14 12 c0 6 -8 8 -14 4 Z" fill="#f5c518"/>
      <circle cx="34" cy="46" r="5" fill="#e23b3b"/>
      <circle cx="30" cy="60" r="5" fill="#3fae54"/>
      <circle cx="44" cy="40" r="5" fill="#3b7de2"/>
      <circle cx="52" cy="52" r="5" fill="#9b4fd0"/>
      <rect x="66" y="60" width="8" height="26" rx="4" fill="#8d6e63" transform="rotate(35 70 73)"/>
      <path d="M70 40 l10 6 l-8 12 l-9 -5 Z" fill="#ec5a92"/>
    </svg>
  </a>
  <!-- 소리 놀이: 음표와 패드 -->
  <a class="toy" href="소리놀이.html" aria-label="소리 놀이">
    <svg viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#fbf6ea"/>
      <rect x="20" y="20" width="26" height="26" rx="6" fill="#e23b3b"/>
      <rect x="54" y="20" width="26" height="26" rx="6" fill="#f5c518"/>
      <rect x="20" y="54" width="26" height="26" rx="6" fill="#3fae54"/>
      <rect x="54" y="54" width="26" height="26" rx="6" fill="#3b7de2"/>
      <circle cx="63" cy="66" r="7" fill="#2a2540"/>
      <rect x="68" y="40" width="4" height="28" fill="#2a2540"/>
      <path d="M68 40 q12 -3 12 6 l-12 3 Z" fill="#2a2540"/>
    </svg>
  </a>
  <!-- 붓기 놀이: 색 튜브 -->
  <a class="toy" href="붓기놀이.html" aria-label="붓기 놀이">
    <svg viewBox="0 0 100 100">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#eaf3f7"/>
      <g>
        <rect x="24" y="26" width="16" height="52" rx="7" fill="none" stroke="#b9c9d2" stroke-width="3"/>
        <rect x="26" y="52" width="12" height="24" rx="4" fill="#e23b3b"/>
        <rect x="26" y="40" width="12" height="12" fill="#3b7de2"/>
      </g>
      <g>
        <rect x="44" y="26" width="16" height="52" rx="7" fill="none" stroke="#b9c9d2" stroke-width="3"/>
        <rect x="46" y="58" width="12" height="18" rx="4" fill="#f5c518"/>
      </g>
      <g>
        <rect x="64" y="26" width="16" height="52" rx="7" fill="none" stroke="#b9c9d2" stroke-width="3"/>
        <rect x="66" y="46" width="12" height="30" rx="4" fill="#3fae54"/>
      </g>
    </svg>
  </a>
</div>
</body>
</html>

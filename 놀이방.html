<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; background:#f3ecdb; }
  body { overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #room {
    min-height:100vh; display:flex; flex-wrap:wrap;
    align-items:center; align-content:center; justify-content:center; gap:5vmin; padding:6vmin calc(6vmin + env(safe-area-inset-right)) calc(6vmin + env(safe-area-inset-bottom)) calc(6vmin + env(safe-area-inset-left));
  }
  .toy {
    position:relative;
    display:block; width:30vmin; height:30vmin; max-width:300px; max-height:300px;
    border:none; border-radius:28px; cursor:pointer; background:#fffdf7;
    box-shadow:0 8px 20px rgba(0,0,0,.14);
    animation:bob 3.2s ease-in-out infinite;
    transition:transform .15s ease;
  }
  .age {
    position:absolute; top:-1.5vmin; right:-1.5vmin; z-index:2;
    background:#ff8f3c; color:#fff; font-weight:800; font-family:sans-serif;
    font-size:min(3.4vmin,30px); padding:0.6vmin 2vmin; border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.25); white-space:nowrap;
  }
  .guide {
    flex:1 0 100%; text-align:center; color:#7a6a4a; font-family:sans-serif;
    font-size:min(4.2vmin,22px); font-weight:700; padding:1vmin 2vmin 0;
  }
  .guide small { display:block; font-weight:500; font-size:min(3.2vmin,15px); opacity:.8; margin-top:.6vmin; }
  .grouphdr {
    flex:1 0 100%; text-align:center; margin:2vmin 0 0.5vmin;
    color:#5a6b8a; font-family:sans-serif; font-weight:800; font-size:min(4.4vmin,22px);
  }
  .grouphdr::before, .grouphdr::after { content:'·····'; opacity:.4; margin:0 1.5vmin; letter-spacing:2px; }
  #bgm {
    position:fixed; top:calc(2vmin + env(safe-area-inset-top)); right:calc(2vmin + env(safe-area-inset-right)); z-index:20;
    width:min(9vmin,52px); height:min(9vmin,52px); border:none; border-radius:50%; cursor:pointer;
    background:#fff; font-size:min(5vmin,26px); line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  #bgm:active { transform:scale(.9); }
  #bgm.off { opacity:.55; }
  #parent {
    position:fixed; top:calc(2vmin + env(safe-area-inset-top)); right:calc(2vmin + min(9vmin,52px) + 3vmin + env(safe-area-inset-right)); z-index:20;
    width:min(9vmin,52px); height:min(9vmin,52px); border:none; border-radius:50%; cursor:pointer;
    background:#fff; font-size:min(5vmin,26px); line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  #parent:active { transform:scale(.9); }
  .favstar { position:absolute; top:-1.5vmin; left:-1.5vmin; z-index:2; font-size:min(6vmin,34px); filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  /* 부모 패널 */
  #panel { position:fixed; inset:0; z-index:50; background:rgba(30,24,14,.55); display:none; align-items:center; justify-content:center; padding:5vmin; }
  #panel.open { display:flex; }
  .pbox { background:#fff; border-radius:20px; width:min(92vw,460px); max-height:86vh; overflow-y:auto; padding:5vmin; font-family:sans-serif; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .ptitle { font-size:min(6vmin,26px); font-weight:800; color:#5a4a2a; text-align:center; margin-bottom:3vmin; }
  .prow { display:flex; align-items:center; gap:2.5vmin; font-size:min(4.6vmin,19px); color:#444; padding:2vmin 0; }
  .prow input { width:min(6vmin,26px); height:min(6vmin,26px); }
  .phdr { margin:3vmin 0 1.5vmin; font-weight:700; color:#7a6a4a; font-size:min(4.2vmin,17px); }
  #favlist { display:flex; flex-direction:column; gap:1vmin; }
  .favitem { display:flex; align-items:center; justify-content:space-between; padding:2vmin 3vmin; background:#f7f2e6; border-radius:12px; font-size:min(4.4vmin,18px); color:#5a4a2a; }
  .favitem button { border:none; background:none; cursor:pointer; font-size:min(6.5vmin,30px); line-height:1; }
  #pclose { display:block; width:100%; margin-top:4vmin; border:none; background:#ffd873; color:#5b4a1a; font-weight:800; font-size:min(5vmin,20px); padding:3vmin; border-radius:14px; cursor:pointer; }
  #pclose:active { transform:scale(.97); }
  .toy:nth-child(2){ animation-delay:.6s; }
  .toy:nth-child(3){ animation-delay:1.2s; }
  .toy:nth-child(4){ animation-delay:1.8s; }
  .toy:nth-child(5){ animation-delay:2.4s; }
  .toy:nth-child(6){ animation-delay:3s; }
  .toy:nth-child(7){ animation-delay:3.6s; }
  .toy:nth-child(8){ animation-delay:4.2s; }
  .toy:nth-child(9){ animation-delay:4.8s; }
  .toy:nth-child(10){ animation-delay:5.4s; }
  .toy:nth-child(11){ animation-delay:6s; }
  .toy:nth-child(12){ animation-delay:6.6s; }
  .toy:nth-child(13){ animation-delay:7.2s; }
  .toy:nth-child(14){ animation-delay:7.8s; }
  .toy:nth-child(n+15){ animation-delay:8.4s; }
  .toy:active { transform:scale(.94); }
  .toy svg { width:100%; height:100%; }
  @keyframes bob { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1.4vmin); } }
</style>

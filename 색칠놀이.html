<!-- 유아 자유탐색형 색칠놀이 - 선그림 아래를 문질러 칠하기(선은 항상 위에 유지) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>색칠 놀이</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#fbf6ea; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }

  #topbar { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2.2vw; padding:calc(1vh + env(safe-area-inset-top)) 2vw 0.6vh; }
  #themes { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2.2vw; }
  .theme { border:none; background:#fffdf7; border-radius:16px; cursor:pointer; width:1.7cm; height:1.7cm; max-width:15vw; max-height:8vh; font-size:6vw; line-height:1; box-shadow:0 2px 5px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; }
  .theme.on { background:#ffe7a3; transform:scale(1.12); }

  #mid { flex:1; position:relative; }
  #artwrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .artbox { position:relative; background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1); overflow:hidden; }
  /* 색입혀진 그림을 연하게(색바램) 아래에 깔고, 위 투명 캔버스에 칠함 */
  #lines { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; opacity:.6; z-index:1; }
  #paint { position:absolute; inset:0; width:100%; height:100%; z-index:2; touch-action:none; cursor:pointer; }

  #palette { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:2.4vw; padding:1.2vh 2vw calc(1.2vh + env(safe-area-inset-bottom)); background:#efe9dc; }
  .swatch { flex:0 0 auto; width:min(1.9cm, 14vw); aspect-ratio:1; border-radius:50%; border:2px solid rgba(0,0,0,.12); cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,.18); transition:transform .12s ease; }
  .swatch.on { transform:scale(1.22); box-shadow:0 0 0 4px #fff, 0 3px 8px rgba(0,0,0,.3); }

  #home { flex:0 0 auto; width:1.5cm; height:1.5cm; max-width:12vw; max-height:8vh; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#fff; text-decoration:none; font-size:5.5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }

  #tools { display:flex; gap:1.6vw; }
  #tools button { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.5cm; height:1.5cm; max-width:12vw; max-height:8vh; font-size:5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #tools button:active { transform:scale(.9); }

  /* 캐릭터 개인 업로드: 빈 화면 안내 + 추가/비우기 */
  #picknote { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4vw; color:#9a8c6a; font-size:4.5vw; }
  #pickbig { border:none; background:#ffd54f; color:#5b4a1a; font-weight:bold; font-size:5.5vw; padding:3.5vw 7vw; border-radius:18px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  #pickbig:active { transform:scale(.95); }
  #charctl { position:fixed; left:calc(3vw + env(safe-area-inset-left)); bottom:calc(15vh + env(safe-area-inset-bottom)); z-index:30; display:none; gap:2vw; }
  #charctl button { border:none; border-radius:50%; cursor:pointer; width:1.4cm; height:1.4cm; max-width:11vw; max-height:6.5vh; font-size:5vw; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18); }

  /* 그림 고르기 오버레이 */
  #gallery { position:fixed; inset:0; z-index:100; background:rgba(30,24,14,.6); display:none; flex-direction:column; }
  #gallery.open { display:flex; }
  #gallery .ghead { flex:0 0 auto; display:flex; justify-content:flex-end; padding:calc(1.5vh + env(safe-area-inset-top)) 4vw 1vh; }
  #gallery .gclose { width:12vw; height:12vw; max-width:54px; max-height:54px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:6vw; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  #gallery .gclose:active { transform:scale(.9); }
  #gallery .ggrid { flex:1; overflow-y:auto; padding:0 4vw calc(4vh + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(auto-fill, minmax(24vw,1fr)); gap:3vw; align-content:start; }
  #gallery .thumb { width:100%; aspect-ratio:1; background:#fff; border-radius:14px; object-fit:contain; padding:8px; box-shadow:0 2px 6px rgba(0,0,0,.2); cursor:pointer; }
  #gallery .thumb:active { transform:scale(.94); }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
    <div id="themes"></div>
    <div id="tools">
      <button id="gallery-btn" aria-label="그림 고르기">📑</button>
      <button id="reset" aria-label="다시">🧽</button>
      <button id="next" aria-label="새 그림">🔄</button>
    </div>
  </div>
  <div id="mid"><div id="artwrap"><div class="artbox"><canvas id="paint"></canvas><img id="lines" alt=""></div></div></div>
  <div id="palette"></div>
</div>
<div id="gallery"><div class="ghead"><div class="gclose">✕</div></div><div class="ggrid"></div></div>
<input id="filepick" type="file" multiple hidden>
<div id="charctl"><button id="charadd" aria-label="사진 추가">＋</button><button id="charclear" aria-label="사진 비우기">🗑</button></div>

<script src="packs/puzzle-manifest.js"></script>
<script>
const P = window.PUZZLE_IMAGES || {};
const THEMES = [
  { id:'공룡', icon:'🦕' }, { id:'자동차', icon:'🚗' }, { id:'사물', icon:'⚽' }, { id:'캐릭터', icon:'🦸' },
];
// 기본 도안 + 테마별 개인 업로드(브라우저 localStorage에만 저장, 배포 없음). 캐릭터는 퍼즐과 공유.
const DEFAULTS = { '공룡':P['공룡']||[], '자동차':P['자동차']||[], '사물':P['사물']||[], '캐릭터':[] };
function upKey(id){ return id==='캐릭터' ? 'charImages' : 'colorUp_'+id; }
function loadUp(id){ try { return JSON.parse(localStorage.getItem(upKey(id))||'[]'); } catch(e){ return []; } }
function saveUp(id,a){ try { localStorage.setItem(upKey(id), JSON.stringify(a)); } catch(e){} }
function curId(){ return THEMES[themeIdx].id; }
function curFiles(){ return DEFAULTS[curId()].concat(loadUp(curId())); }
function addFiles(list){
  const files=[...list]; if(!files.length) return;
  let pending=files.length; const added=[];
  const done=()=>{ if(--pending===0) finish(); };
  files.forEach(f=>{ const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{added.push(rd.result);done();}; im.onerror=done; im.src=rd.result; }; rd.onerror=done; rd.readAsDataURL(f); });
  function finish(){ if(!added.length) return; const id=curId(); saveUp(id, loadUp(id).concat(added)); picIdx=0; loadPage(); ping(); }
}
function clearUp(){ saveUp(curId(), []); picIdx=0; loadPage(); }
const COLORS = ['#e23b3b','#ef7d1a','#f5c518','#3fae54','#4aa3df','#3b7de2','#9b4fd0','#ec5a92','#8d6e63','#333333','#ffffff'];
let current = COLORS[0], themeIdx = 0, picIdx = 0;
const RES = 560;

const box = document.querySelector('.artbox');
const paint = document.getElementById('paint');
const lines = document.getElementById('lines');
const pctx = paint.getContext('2d');
paint.width = paint.height = RES;

function fitBox(){
  const mid = document.getElementById('mid');
  const s = Math.min(mid.clientWidth, mid.clientHeight) * 0.95;
  box.style.width = box.style.height = s + 'px';
  paint.style.width = paint.style.height = s + 'px';
}

function clearPaint(){ pctx.clearRect(0,0,RES,RES); } // 투명 = 아래 색바램 그림이 비침

// 색입혀진 그림을 연하게(색바램) 아래 레이어로. 위 투명 캔버스에 칠하면 덮임
function loadPage(){
  const mid=document.getElementById('mid');
  if(!mid.clientWidth || !mid.clientHeight){ requestAnimationFrame(loadPage); return; } // 레이아웃 전이면 재시도
  const files = curFiles();
  fitBox(); clearPaint(); updateCharCtl(); removePickNote();
  if(!files.length){ lines.removeAttribute('src'); showPickNote(); return; }
  lines.src = files[picIdx % files.length];
}
function removePickNote(){ const n=document.getElementById('picknote'); if(n) n.remove(); }
function showPickNote(){
  removePickNote();
  const n=document.createElement('div'); n.id='picknote';
  n.innerHTML='<div>내 그림으로 색칠하기</div>';
  const b=document.createElement('button'); b.id='pickbig'; b.textContent='🖼️ 사진 고르기';
  b.onclick=()=>filepick.click(); n.appendChild(b);
  document.getElementById('artwrap').appendChild(n);
}
function updateCharCtl(){ document.getElementById('charctl').style.display = 'flex'; document.getElementById('charclear').style.display = loadUp(curId()).length ? '' : 'none'; }

// --- 문질러 칠하기 ---
let drawing = false, last = null;
function toXY(e){ const r = paint.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*RES, y:(e.clientY-r.top)/r.height*RES }; }
function dab(p){
  pctx.strokeStyle = pctx.fillStyle = current;
  pctx.lineCap = 'round'; pctx.lineJoin = 'round'; pctx.lineWidth = RES*0.11;
  if(last){ pctx.beginPath(); pctx.moveTo(last.x,last.y); pctx.lineTo(p.x,p.y); pctx.stroke(); }
  pctx.beginPath(); pctx.arc(p.x,p.y,RES*0.055,0,7); pctx.fill();
  last = p;
}
paint.addEventListener('pointerdown', (e)=>{ drawing=true; last=null; audio(); dab(toXY(e)); fillSound(); paint.setPointerCapture(e.pointerId); });
paint.addEventListener('pointermove', (e)=>{ if(drawing) dab(toXY(e)); });
function endDraw(){ drawing=false; last=null; }
paint.addEventListener('pointerup', endDraw);
paint.addEventListener('pointercancel', endDraw);

// 상단 테마 버튼
const topbar = document.getElementById('themes');
THEMES.forEach((t,i)=>{
  const b=document.createElement('button'); b.className='theme'+(i===0?' on':''); b.textContent=t.icon; b.title=t.id;
  b.addEventListener('click', ()=>{ themeIdx=i; picIdx=0; document.querySelectorAll('.theme').forEach(x=>x.classList.remove('on')); b.classList.add('on'); loadPage(); ping(); });
  topbar.appendChild(b);
});

// 색 팔레트
const palette = document.getElementById('palette');
COLORS.forEach((c,i)=>{
  const s=document.createElement('button'); s.className='swatch'+(i===0?' on':''); s.style.background=c; s.title=c;
  s.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); current=c; document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on')); s.classList.add('on'); ping(); });
  palette.appendChild(s);
});

document.getElementById('next').addEventListener('click', ()=>{ const f=curFiles(); if(f.length){ picIdx=(picIdx+1)%f.length; loadPage(); ping(); } });
document.getElementById('reset').addEventListener('click', ()=>{ clearPaint(); ping(); });

// 그림 고르기(썸네일)
const gallery = document.getElementById('gallery');
gallery.querySelector('.gclose').addEventListener('click', ()=> gallery.classList.remove('open'));
gallery.addEventListener('click', (e)=>{ if(e.target===gallery || e.target.classList.contains('ggrid') || e.target.classList.contains('ghead')) gallery.classList.remove('open'); });
document.getElementById('gallery-btn').addEventListener('click', ()=>{
  const files=curFiles(); const grid=gallery.querySelector('.ggrid'); grid.innerHTML='';
  if(!files.length){ filepick.click(); return; }
  files.forEach((src,i)=>{ const im=document.createElement('img'); im.className='thumb'; im.loading='lazy'; im.src=src; im.addEventListener('click',()=>{ picIdx=i; gallery.classList.remove('open'); loadPage(); ping(); }); grid.appendChild(im); });
  gallery.classList.add('open'); ping();
});

// 캐릭터 개인 업로드 컨트롤
const filepick = document.getElementById('filepick');
filepick.addEventListener('change', (e)=>{ addFiles(e.target.files); filepick.value=''; });
document.getElementById('charadd').addEventListener('click', ()=> filepick.click());
document.getElementById('charclear').addEventListener('click', clearUp);

window.addEventListener('resize', fitBox);

// --- 소리 ---
let ac;
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function beep(f,d,type='sine',v=0.08){ const a=audio(),o=a.createOscillator(),g=a.createGain(); o.type=type;o.frequency.value=f;g.gain.value=0.001;o.connect(g).connect(a.destination);o.start(); g.gain.linearRampToValueAtTime(v,a.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d); o.stop(a.currentTime+d+0.02); }
function fillSound(){ beep(430,0.12,'sine',0.06); }
function ping(){ beep(600,0.12,'triangle'); }

loadPage();
window.addEventListener('load', loadPage);
</script>
</body>
</html>

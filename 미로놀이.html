<!-- 유아 학습형 미로 찾기 - 손가락으로 길을 따라 별까지 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>미로 찾기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#eef3fb; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }
  #mid { flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    padding:calc(9vh + env(safe-area-inset-top)) 3vw calc(9vh + env(safe-area-inset-bottom)); }
  #art { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.1); touch-action:none; cursor:pointer; }

  #home { position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:10;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:5.5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #bottom { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:3vw; }
  #diff { display:flex; gap:2vw; }
  #diff button { border:none; background:#d6e0f0; color:#3a4a66; font-weight:bold; border-radius:12px; cursor:pointer;
    width:1.2cm; height:1.2cm; max-width:9vw; max-height:5.5vh; font-size:4.6vw; box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #diff button.on { background:#5a7bc0; color:#fff; transform:scale(1.1); }
  #new { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.4cm; height:1.4cm; max-width:11vw; max-height:6vh; font-size:5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #new:active { transform:scale(.9); }
</style>
</head>
<body>
<div id="stage"><div id="mid"><canvas id="art"></canvas></div></div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<div id="bottom">
  <div id="diff">
    <button data-n="6" aria-label="쉬움">6</button>
    <button data-n="8" aria-label="보통">8</button>
    <button data-n="10" aria-label="어려움">10</button>
  </div>
  <button id="new" aria-label="새 미로">🔄</button>
</div>
<script src="미로놀이.js"></script>
</body>
</html>

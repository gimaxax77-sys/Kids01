<!-- 유아 학습형 알파벳 - 흐린 글자를 따라 그으면 완성+음성(5세+) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>알파벳</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#fbf6ea; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }
  #mid { flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    padding:calc(9vh + env(safe-area-inset-top)) 3vw calc(10vh + env(safe-area-inset-bottom)); }
  #art { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.1); touch-action:none; cursor:pointer; }
  #home { position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:10;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:5.5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite; }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #tools { position:fixed; top:calc(2vh + env(safe-area-inset-top)); right:calc(3vw + env(safe-area-inset-right)); z-index:10; display:flex; gap:2vw; }
  #tools button { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.5cm; height:1.5cm; max-width:12vw; max-height:7vh; font-size:5vw; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #tools button:active { transform:scale(.9); }
  #diff { position:fixed; left:50%; bottom:calc(1.6vh + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10; display:flex; gap:2.5vw; }
  #diff button { border:none; background:#efe6cf; color:#6b5b39; font-weight:bold; border-radius:12px; cursor:pointer;
    width:1.6cm; height:1.2cm; max-width:16vw; max-height:5.5vh; font-size:4.4vw; box-shadow:0 2px 4px rgba(0,0,0,.12); }
  #diff button.on { background:#cdbd97; color:#fff; transform:scale(1.1); }
</style>
</head>
<body>
<div id="stage"><div id="mid"><canvas id="art"></canvas></div></div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<div id="tools">
  <button id="reset" aria-label="다시">🧽</button>
  <button id="next" aria-label="다음 글자">🔄</button>
</div>
<div id="diff">
  <button data-k="upper" aria-label="대문자">ABC</button>
  <button data-k="lower" aria-label="소문자">abc</button>
</div>
<script src="알파벳.js"></script>
</body>
</html>

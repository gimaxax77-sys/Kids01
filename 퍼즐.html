<!-- 유아 자유탐색형 조각맞추기 퍼즐 - 이미지를 격자로 잘라 드래그로 맞추기 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>조각 맞추기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#fbf6ea; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }

  /* 상단 바: 홈 + 테마 + 난이도를 한 줄에, 좁으면 자동 줄바꿈 */
  #topbar {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2.2vw;
    padding:calc(1vh + env(safe-area-inset-top)) 2vw 0.6vh;
  }
  #themes { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2.2vw; }
  .theme {
    border:none; background:#fffdf7; border-radius:16px; cursor:pointer;
    width:1.7cm; height:1.7cm; max-width:15vw; max-height:8vh;
    font-size:min(6vw,39px); line-height:1; box-shadow:0 2px 5px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
  }
  .theme.on { background:#ffe7a3; transform:scale(1.12); }

  /* 중앙 보드 영역 */
  #mid { flex:1; position:relative; }
  #board { position:absolute; }
  #guide { position:absolute; inset:0; background-size:contain; background-repeat:no-repeat; background-position:center; opacity:.16; }
  .slot {
    position:absolute; border:2px dashed #c9bd9c; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
  }
  .slot.filled { border-color:transparent; }

  /* 조각 공통: 퍼센트 배경으로 잘라 크기 무관하게 같은 조각 표시 */
  .piece {
    background-repeat:no-repeat; border-radius:8px; cursor:grab;
    box-shadow:0 3px 6px rgba(0,0,0,.22); touch-action:none;
  }
  .piece.lift { position:fixed; z-index:100; cursor:grabbing; box-shadow:0 10px 16px rgba(0,0,0,.32); }
  .piece.locked { box-shadow:none; cursor:default; width:100%; height:100%; border-radius:6px; }

  /* 하단 조각 트레이 */
  #tray {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:2.4vw;
    padding:1.2vh 2vw calc(1.2vh + env(safe-area-inset-bottom));
    height:26vh; align-content:center; overflow-y:auto; flex:0 0 auto;
  }
  #tray .piece { width:min(2.4cm, 17vw); aspect-ratio:1; flex:0 0 auto; }

  /* 홈 (상단 바 안) */
  #home {
    width:1.5cm; height:1.5cm; max-width:12vw; max-height:8vh; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:min(5.5vw,36px);
    box-shadow:0 2px 6px rgba(0,0,0,.18); animation:breathe 3s ease-in-out infinite;
  }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }

  /* 난이도(조각 수, 상단 바 안) */
  #diff { display:flex; gap:1.6vw; }
  #diff button {
    border:none; background:#e6dcc4; border-radius:12px; cursor:pointer; color:#6b5b39; font-weight:bold;
    width:1.2cm; height:1.2cm; max-width:9vw; max-height:5.5vh; font-size:min(4.4vw,29px);
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  #diff button.on { background:#cdbd97; color:#fff; transform:scale(1.1); }

  #note { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#9a8c6a; font-size:min(4.5vw,29px); padding:8vw; line-height:1.5; }
  #pickbig { border:none; background:#ffd54f; color:#5b4a1a; font-weight:bold; font-size:min(5.5vw,36px); padding:3.5vw 7vw; border-radius:18px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  #pickbig:active { transform:scale(.95); }

  /* 캐릭터 사진 추가/비우기 */
  #charctl { position:fixed; left:calc(3vw + env(safe-area-inset-left)); bottom:calc(1.6vh + env(safe-area-inset-bottom)); z-index:30; gap:2vw; }
  #charctl button { border:none; border-radius:50%; cursor:pointer; width:1.5cm; height:1.5cm; max-width:11vw; max-height:6.5vh; font-size:min(5vw,32px); background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #charctl button:active { transform:scale(.9); }

  .slot.win { animation:glow .6s ease; }
  @keyframes glow { 50%{ transform:scale(1.12);} }

  /* 다음그림 / 그림고르기 도구 (상단 바 안) */
  #tools { display:flex; gap:1.6vw; }
  #tools button { border:none; background:#fff; border-radius:50%; cursor:pointer; width:1.5cm; height:1.5cm; max-width:12vw; max-height:8vh; font-size:min(5vw,32px); box-shadow:0 2px 6px rgba(0,0,0,.18); }
  #tools button:active { transform:scale(.9); }

  /* 그림 고르기 오버레이 (헤더 + 스크롤 그리드, 겹침 없음) */
  #gallery { position:fixed; inset:0; z-index:100; background:rgba(30,24,14,.6); display:none; flex-direction:column; }
  #gallery.open { display:flex; }
  #gallery .ghead { flex:0 0 auto; display:flex; justify-content:flex-end; padding:calc(1.5vh + env(safe-area-inset-top)) 4vw 1vh; }
  #gallery .gclose { width:12vw; height:12vw; max-width:54px; max-height:54px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:min(6vw,39px); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  #gallery .gclose:active { transform:scale(.9); }
  #gallery .ggrid { flex:1; overflow-y:auto; padding:0 4vw calc(4vh + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(auto-fill, minmax(24vw,1fr)); gap:3vw; align-content:start; }
  #gallery .thumb { width:100%; aspect-ratio:1; background:#fff; border-radius:14px; object-fit:contain; padding:6px; box-shadow:0 2px 6px rgba(0,0,0,.2); cursor:pointer; }
  #gallery .thumb:active { transform:scale(.94); }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
    <div id="themes"></div>
    <div id="diff"></div>
    <div id="tools">
      <button id="gallery-btn" aria-label="그림 고르기">📑</button>
      <button id="next" aria-label="다음 그림">🔄</button>
    </div>
  </div>
  <div id="mid"><div id="board"></div></div>
  <div id="tray"></div>
</div>
<!-- 그림 고르기(썸네일) -->
<div id="gallery"><div class="ghead"><div class="gclose">✕</div></div><div class="ggrid"></div></div>
<!-- 캐릭터: 아무 이름·아무 확장자 이미지나 선택 -->
<input id="filepick" type="file" multiple hidden>
<div id="charctl" style="display:none">
  <button id="charadd" aria-label="사진 추가">＋</button>
  <button id="charclear" aria-label="사진 비우기">🗑</button>
</div>

<!-- 이미지 목록은 images/ 폴더에서 자동 생성됨(직접 수정 금지). 히어로는 저작권상 제외 -->
<script src="packs/puzzle-manifest.js"></script>
<script>
// 테마: 공룡/자동차/사물은 매니페스트에서. 캐릭터는 사용자가 직접 고른 이미지(브라우저에만 저장, 개인용)
const M = window.PUZZLE_IMAGES || {};
const CHAR = 3; // 캐릭터 테마 인덱스
const THEMES = [
  { id:'공룡', icon:'🦕', files: M['공룡'] || [] },
  { id:'자동차', icon:'🚗', files: M['자동차'] || [] },
  { id:'사물', icon:'⚽', files: M['사물'] || [] },
  { id:'캐릭터', icon:'🦸', files: [] }, // 아래에서 저장분 채움
];
let themeIdx = 0, picIdx = 0, N = 2;

const mid = document.getElementById('mid');
const board = document.getElementById('board');
const tray = document.getElementById('tray');

// 캐릭터 이미지: 브라우저(localStorage)에만 저장 — 업로드·배포 없음
function loadChars(){ try { return JSON.parse(localStorage.getItem('charImages') || '[]'); } catch(e) { return []; } }
function saveChars(a){ try { localStorage.setItem('charImages', JSON.stringify(a)); } catch(e) { /* 용량초과 등: 이번 세션에선 유지 */ } }
THEMES[CHAR].files = loadChars();

// 아무 이름·아무 확장자 이미지나 골라 추가(이미지로 열리는 것만 채택)
function addFiles(fileList){
  const files = [...fileList]; if(!files.length) return;
  let pending = files.length; const added = [];
  const done = () => { if(--pending === 0) finish(); };
  files.forEach(f => {
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => { added.push(rd.result); done(); }; im.onerror = done; im.src = rd.result; };
    rd.onerror = done;
    rd.readAsDataURL(f);
  });
  function finish(){
    if(!added.length) return;
    THEMES[CHAR].files = THEMES[CHAR].files.concat(added);
    saveChars(THEMES[CHAR].files);
    picIdx = 0;
    if(themeIdx === CHAR) loadPuzzle();
    ping();
  }
}
function clearChars(){ THEMES[CHAR].files = []; saveChars([]); picIdx = 0; if(themeIdx === CHAR) loadPuzzle(); }

function curImages() { return THEMES[themeIdx].files; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 보드 크기 계산 후 퍼즐 깔기
function loadPuzzle() {
  board.innerHTML = ''; tray.innerHTML = '';
  const oldNote = mid.querySelector('#note'); if (oldNote) oldNote.remove();
  updateCharCtl();
  const imgs = curImages();
  if (!imgs.length) {
    const n = document.createElement('div'); n.id = 'note';
    if (themeIdx === CHAR) {
      n.innerHTML = '<div style="margin-bottom:4vw">내 사진으로 퍼즐 만들기</div>';
      const btn = document.createElement('button'); btn.id = 'pickbig'; btn.textContent = '🖼️ 사진 고르기';
      btn.onclick = () => filepick.click();
      n.appendChild(btn);
    } else {
      n.textContent = THEMES[themeIdx].id + ' 이미지가 아직 없어요.';
    }
    mid.appendChild(n); return;
  }
  const src = imgs[picIdx % imgs.length];

  const mw = mid.clientWidth, mh = mid.clientHeight;
  if (!mw || !mh) { requestAnimationFrame(loadPuzzle); return; }
  const B = Math.min(mw * 0.92, mh * 0.92);
  const tile = B / N;
  board.style.width = board.style.height = B + 'px';
  board.style.left = (mw - B) / 2 + 'px';
  board.style.top  = (mh - B) / 2 + 'px';

  // 안내용 흐린 전체 그림
  const guide = document.createElement('div'); guide.id = 'guide';
  guide.style.backgroundImage = `url("${src}")`;
  board.appendChild(guide);

  // 슬롯 + 조각 생성
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const idx = r * N + c;
    const slot = document.createElement('div');
    slot.className = 'slot'; slot.dataset.idx = idx;
    slot.style.left = c*tile+'px'; slot.style.top = r*tile+'px';
    slot.style.width = slot.style.height = tile+'px';
    board.appendChild(slot);
    cells.push({ idx, r, c });
  }

  // 조각을 트레이에 섞어서
  shuffle(cells).forEach(cell => {
    const p = document.createElement('div');
    p.className = 'piece'; p.dataset.idx = cell.idx;
    p.style.backgroundImage = `url("${src}")`;
    p.style.backgroundSize = (N*100) + '% ' + (N*100) + '%';
    // 퍼센트 위치: N>1일 때 c/(N-1), r/(N-1)
    const px = N>1 ? (cell.c/(N-1))*100 : 0;
    const py = N>1 ? (cell.r/(N-1))*100 : 0;
    p.style.backgroundPosition = px + '% ' + py + '%';
    attachDrag(p, tile);
    tray.appendChild(p);
  });
}

let dragging = null;
function attachDrag(p, tile) {
  let offX = 0, offY = 0;
  p.addEventListener('pointerdown', (e) => {
    if (p.classList.contains('locked')) return;
    dragging = p; audio();
    const r = p.getBoundingClientRect();
    // 트레이 크기 그대로 들어올림
    p.style.width = r.width + 'px'; p.style.height = r.height + 'px';
    p.classList.add('lift');
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
    p.setPointerCapture(e.pointerId);
  });
  p.addEventListener('pointermove', (e) => {
    if (dragging !== p) return;
    p.style.left = (e.clientX - offX) + 'px';
    p.style.top  = (e.clientY - offY) + 'px';
  });
  p.addEventListener('pointerup', (e) => {
    if (dragging !== p) return;
    dragging = null;
    const slot = [...board.querySelectorAll('.slot')].find(s => {
      const r = s.getBoundingClientRect();
      return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
    });
    if (slot && slot.dataset.idx === p.dataset.idx && !slot.classList.contains('filled')) {
      // 정답: 슬롯에 딱 맞춰 고정
      p.classList.remove('lift'); p.classList.add('locked');
      p.style.left = p.style.top = ''; p.style.width = p.style.height = '';
      slot.classList.add('filled'); slot.appendChild(p);
      slot.classList.remove('win'); void slot.offsetWidth; slot.classList.add('win');
      happy();
      if (board.querySelectorAll('.slot.filled').length === N*N) win();
    } else {
      // 오답: 트레이로 돌려보냄(벌 없음)
      p.classList.remove('lift');
      p.style.left = p.style.top = ''; p.style.width = p.style.height = '';
      tray.appendChild(p);
      blip();
    }
  });
}

// 완성: 축하 후 다음 그림
function win() {
  const g = document.getElementById('guide'); if (g) g.style.opacity = 0;
  const slots = [...board.querySelectorAll('.slot')];
  slots.forEach((s,i) => setTimeout(() => { s.classList.remove('win'); void s.offsetWidth; s.classList.add('win'); }, i*70));
  chord();
  setTimeout(() => { picIdx++; loadPuzzle(); }, 1500);
}

// 상단 테마 버튼
const topbar = document.getElementById('themes');
THEMES.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'theme' + (i===themeIdx?' on':''); b.textContent = t.icon; b.title = t.id;
  b.addEventListener('click', () => {
    themeIdx = i; picIdx = 0;
    document.querySelectorAll('.theme').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    loadPuzzle(); ping();
  });
  topbar.appendChild(b);
});

// 난이도(조각 수) 버튼
const diff = document.getElementById('diff');
[2,3,4].forEach(n => {
  const b = document.createElement('button');
  b.textContent = (n*n); b.className = (n===N?'on':''); // 4/9/16 조각
  b.addEventListener('click', () => {
    N = n; // 조각 수만 바꾸고 현재 그림 유지
    document.querySelectorAll('#diff button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    loadPuzzle(); ping();
  });
  diff.appendChild(b);
});

// 다음 그림(완성 안 해도 넘김)
document.getElementById('next').addEventListener('click', () => {
  const imgs = curImages(); if(!imgs.length){ if(themeIdx===CHAR) filepick.click(); return; }
  picIdx = (picIdx + 1) % imgs.length; loadPuzzle(); ping();
});

// 그림 고르기(썸네일)
const gallery = document.getElementById('gallery');
gallery.querySelector('.gclose').addEventListener('click', () => gallery.classList.remove('open'));
gallery.addEventListener('click', (e) => { if(e.target === gallery || e.target.classList.contains('ggrid') || e.target.classList.contains('ghead')) gallery.classList.remove('open'); });
document.getElementById('gallery-btn').addEventListener('click', () => {
  const imgs = curImages(); const grid = gallery.querySelector('.ggrid'); grid.innerHTML = '';
  if(!imgs.length){ if(themeIdx===CHAR) filepick.click(); return; }
  imgs.forEach((src, i) => {
    const im = document.createElement('img'); im.className = 'thumb'; im.loading = 'lazy'; im.decoding = 'async'; im.src = src;
    im.addEventListener('click', () => { picIdx = i; gallery.classList.remove('open'); loadPuzzle(); ping(); });
    grid.appendChild(im);
  });
  gallery.classList.add('open'); ping();
});

window.addEventListener('resize', () => loadPuzzle());

// --- 소리 ---
let ac;
function audio(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
function beep(f,d,type='sine',v=0.12){ const a=audio(),o=a.createOscillator(),g=a.createGain(); o.type=type;o.frequency.value=f;g.gain.value=0.001;o.connect(g).connect(a.destination);o.start(); g.gain.linearRampToValueAtTime(v,a.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d); o.stop(a.currentTime+d+0.02); }
function happy(){ beep(523,0.15); setTimeout(()=>beep(784,0.2),80); }
function chord(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.35,'triangle'),i*110)); }
function blip(){ beep(196,0.16,'sine',0.08); }
function ping(){ beep(600,0.13,'triangle'); }

// 캐릭터 테마용 컨트롤(사진 추가/비우기) — 캐릭터 테마일 때만 표시
const filepick = document.getElementById('filepick');
filepick.addEventListener('change', (e) => { addFiles(e.target.files); filepick.value = ''; });
document.getElementById('charadd').addEventListener('click', () => filepick.click());
document.getElementById('charclear').addEventListener('click', clearChars);
function updateCharCtl(){
  const show = (themeIdx === CHAR) && THEMES[CHAR].files.length > 0;
  document.getElementById('charctl').style.display = show ? 'flex' : 'none';
}

// 시작
loadPuzzle();
window.addEventListener('load', loadPuzzle);
</script>
</body>
</html>

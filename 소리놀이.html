<!-- 유아 자유탐색형 소리·악기 놀이 - 색 패드를 눌러 소리내기(펜타토닉이라 항상 어울림) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>소리 놀이</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; touch-action:none; background:#2a2540; font-family:sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; }
  #pads { flex:1; display:grid; gap:2.5vw; padding:calc(9vh + env(safe-area-inset-top)) 4vw calc(3vh + env(safe-area-inset-bottom)); }
  .pad {
    border:none; border-radius:20px; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .06s ease, box-shadow .06s ease;
    display:flex; align-items:center; justify-content:center; font-size:min(9vw,58px);
  }
  .pad.hit { transform:translateY(4px) scale(.97); box-shadow:0 2px 0 rgba(0,0,0,.25); filter:brightness(1.25); }
  .pad .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,.5); pointer-events:none; transform:translate(-50%,-50%) scale(0); }
  .pad .ripple.go { animation:rip .5s ease-out forwards; }
  @keyframes rip { to { transform:translate(-50%,-50%) scale(4); opacity:0; } }

  #home {
    position:fixed; top:calc(2vh + env(safe-area-inset-top)); left:calc(3vw + env(safe-area-inset-left)); z-index:10;
    width:1.6cm; height:1.6cm; max-width:12vw; max-height:7vh; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:#fff; text-decoration:none; font-size:min(5.5vw,36px); box-shadow:0 2px 6px rgba(0,0,0,.3); animation:breathe 3s ease-in-out infinite;
  }
  #home:active { transform:scale(.9); }
  @keyframes breathe { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  #inst {
    position:fixed; top:calc(2vh + env(safe-area-inset-top)); right:calc(3vw + env(safe-area-inset-right)); z-index:10;
    border:none; border-radius:50%; cursor:pointer; width:1.9cm; height:1.9cm; max-width:14vw; max-height:8vh;
    background:#fff; font-size:min(6vw,39px); line-height:1; box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  #inst:active { transform:scale(.9); }
  #instname { position:fixed; top:calc(2.4vh + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:10; color:#fff; font-size:min(5vw,32px); font-weight:bold; opacity:.9; }
</style>
</head>
<body>
<div id="stage"><div id="pads"></div></div>
<a id="home" href="놀이방.html" aria-label="놀이방">🏠</a>
<button id="inst" aria-label="악기">🎹</button>
<div id="instname">피아노</div>

<script src="소리놀이.js"></script>
</body>
</html>
